<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 标题 */
        .header {
            text-align: center;
            padding: 25px 20px;
            background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .header h1 {
            font-size: 1.6em;
            line-height: 1.4;
        }

        /* 管理端按钮 - 灰色小按钮，放右边 */
        .admin-bar {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .admin-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
            background: #bdc3c7;
            color: #555;
        }
        .admin-btn:hover {
            background: #95a5a6;
            color: white;
        }

        /* 投票列表 - 紧凑布局 */
        .vote-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .vote-item {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
            cursor: pointer;
        }

        .vote-item:last-child { border-bottom: none; }
        .vote-item:hover { background: #f8f9fa; }

        .vote-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #2980b9;
            flex-shrink: 0;
        }

        .vote-info {
            flex: 1;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .vote-name {
            font-size: 0.95em;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }

        .vote-unit {
            font-size: 0.8em;
            color: #999;
            flex: 1;
            min-width: 150px;
        }

        /* 提交按钮区域 */
        .submit-area {
            text-align: center;
            padding: 20px;
        }

        .btn-submit {
            padding: 14px 50px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #2980b9 0%, #1a5276 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            max-width: 350px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            background: #27ae60;
        }

        .submit-hint {
            margin-top: 10px;
            font-size: 0.9em;
            color: #888;
        }

        /* 弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
            font-size: 1.3em;
        }

        .modal-close {
            float: right;
            font-size: 1.4em;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #333; }

        /* 二维码 */
        .qr-container {
            text-align: center;
            padding: 15px;
        }

        .qr-container img {
            max-width: 250px;
            width: 100%;
            border: 2px solid #eee;
            border-radius: 10px;
        }

        .qr-hint {
            margin-top: 12px;
            color: #666;
            font-size: 0.85em;
        }

        /* 结果统计 */
        .result-stats {
            margin-bottom: 15px;
            text-align: center;
        }

        .result-stats .stat {
            display: inline-block;
            margin: 0 12px;
            padding: 8px 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .result-stats .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #2980b9;
        }

        .result-stats .stat-label {
            font-size: 0.8em;
            color: #888;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
        }

        .result-table th,
        .result-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }

        .result-table th {
            background: #f8f9fa;
            font-weight: bold;
            color: #666;
        }

        .bar-container {
            width: 100%;
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2980b9 0%, #3498db 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .bar-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75em;
            font-weight: bold;
            color: #333;
        }

        /* 确认弹窗 */
        .confirm-modal {
            text-align: center;
            padding: 20px;
        }

        .confirm-modal p {
            margin-bottom: 15px;
            color: #555;
            line-height: 1.6;
        }

        .confirm-modal .warn {
            color: #e74c3c;
            font-weight: bold;
        }

        .confirm-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-confirm-yes {
            padding: 10px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-confirm-no {
            padding: 10px 30px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.3em; }
            .vote-item { padding: 6px 12px; }
            .vote-name { font-size: 0.9em; }
            .vote-unit { font-size: 0.75em; }
        }
    </style>
</head>
<body>

    <!-- 二维码弹窗 -->

    <!-- 结果弹窗 -->

        const TOTAL = candidates.length;

        // ==================== 渲染投票列表 ====================
        function renderVoteList() {
            const listEl = document.getElementById('voteList');
            listEl.innerHTML = candidates.map((c, i) => `
                <label class="vote-item">
                    <input type="checkbox" id="cb_${i}" checked data-index="${i}">
                    <span class="vote-info">
                        <span class="vote-name">${i + 1}. ${c.name}</span>
                        <span class="vote-unit">${c.unit}</span>
                    </span>
                </label>
            `).join('');
        }

        // ==================== 提交逻辑 ====================
        function handleSubmitClick() {
            const checkboxes = document.querySelectorAll('.vote-item input[type="checkbox"]');
            let selectedCount = 0;
            checkboxes.forEach(cb => { if (cb.checked) selectedCount++; });

            if (selectedCount === 0) {
                alert('请至少选择一位候选人');
                return;
            }

            // 如果不是全选，弹出确认
            if (selectedCount < TOTAL) {
                showConfirmModal(selectedCount);
            } else {
                doSubmit();
            }
        }

        function showConfirmModal(selectedCount) {
            const unchecked = TOTAL - selectedCount;
            document.getElementById('confirmText').innerHTML = 
                `您已取消 <span class="warn">${unchecked}</span> 位候选人的勾选<br>` +
                `当前仅选择 <span class="warn">${selectedCount}</span> / ${TOTAL} 人<br><br>` +
                `请确认是否以此状态提交？`;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        function forceSubmitVote() {
            closeConfirmModal();
            doSubmit();
        }

        function doSubmit() {
            const checkboxes = document.querySelectorAll('.vote-item input[type="checkbox"]');
            const selected = [];
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    selected.push(candidates[parseInt(cb.dataset.index)].name);
                }
            });

            // 保存到 localStorage
            const votes = JSON.parse(localStorage.getItem('votes') || '[]');
            votes.push({
                time: new Date().toISOString(),
                selected: selected
            });
            localStorage.setItem('votes', JSON.stringify(votes));

            // 更新按钮为提示语
            const btn = document.getElementById('submitBtn');
            btn.textContent = '✅ 投票已提交，感谢您的参与！';
            btn.disabled = true;
            document.getElementById('submitHint').textContent = '';

            // 禁用所有复选框
            checkboxes.forEach(cb => cb.disabled = true);
        }

        // ==================== 二维码弹窗 ====================
        function showQRModal() {
            const url = window.location.href;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
            document.getElementById('qrImage').src = qrUrl;
            document.getElementById('qrModal').classList.add('active');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('active');
        }

        // ==================== 结果弹窗 ====================
        function showResultModal() {
            const votes = JSON.parse(localStorage.getItem('votes') || '[]');
            const totalVotes = votes.length;

            const countMap = {};
            candidates.forEach(c => countMap[c.name] = 0);
            votes.forEach(v => v.selected.forEach(name => {
                if (countMap[name] !== undefined) countMap[name]++;
            }));

            const sorted = Object.entries(countMap).sort((a, b) => b[1] - a[1]);

            document.getElementById('resultStats').innerHTML = `
                <div class="stat">
                    <div class="stat-value">${totalVotes}</div>
                    <div class="stat-label">总投票人数</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${candidates.length}</div>
                    <div class="stat-label">候选人总数</div>
                </div>
            `;

            document.getElementById('resultBody').innerHTML = sorted.map(([name, cnt], i) => {
                const pct = totalVotes > 0 ? ((cnt / totalVotes) * 100).toFixed(1) : '0.0';
                const barWidth = totalVotes > 0 ? (cnt / totalVotes) * 100 : 0;
                return `
                    <tr>
                        <td>${i + 1}</td>
                        <td><strong>${name}</strong></td>
                        <td>${cnt}</td>
                        <td>
                            <div class="bar-container">
                                <div class="bar-fill" style="width:${barWidth}%"></div>
                                <span class="bar-text">${pct}%</span>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('resultModal').classList.add('active');
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        // ==================== 初始化 ====================
        renderVoteList();
    </script>
</body>
</html>
